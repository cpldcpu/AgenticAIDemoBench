ize(cross(v,vec3(0.,1.,0.)));vec3 X=cross(I,v);vec3 l=normalize(H.x*I+H.y*X+1.7*v);float d,m;float g=T(f,l,d,m);vec3 J=mix(vec3(.02,.01,.05),vec3(.12,.05,.22),smoothstep(-.3,.7,l.y));vec3 e=J;if(g<50.){vec3 a=f+l*g;vec3 h=U(a);float n=V(a,h);vec3 K=normalize(vec3(.35,1.,.25));float L=max(dot(h,K),0.);float M=pow(1.-max(dot(h,-l),0.),3.);if(d>.5){e=vec3(.3,.08,.75)*(.15+.9*L)*n;e+=vec3(.1,.8,.75)*M*.6;e+=vec3(.9,.8,1.)*pow(max(dot(reflect(l,h),K),0.),40.)*.3;}else{float Y=fract(a.y*1.2+.4*r(a.xz*.7));vec3 Z=mix(vec3(.09,.08,.15),vec3(.22,.16,.3),smoothstep(.25,.8,Y));e=Z*(.2+.8*L)*n+vec3(.05,.25,.25)*M*.5;}e+=vec3(.5,.15,1.)*m*.2;e=mix(e,J,1.-exp(-g*.05));}else{e+=vec3(.5,.15,1.)*m*.2;}O=vec4(e,1.);}"), p2 = Q("#version 300 es\nprecision highp float;uniform vec4 R;uniform sampler2D A,B;out vec4 O;vec3 r(vec3 f){return clamp((f*(2.51*f+.03))/(f*(2.43*f+.59)+.14),0.,1.);}float j(vec2 d,vec2 s,float l,float e){vec2 t=vec2(l,l*R.x/R.y/16.);vec2 c=(d-s)/t+.5;if(c.x<0.||c.x>1.||c.y<0.||c.y>1.)return 0.;vec2 m=vec2(c.x,(7.-e+c.y)/8.);return max(texture(B,m).a,.5*textureLod(B,m,2.2).a);}void main(){vec2 d=gl_FragCoord.xy/R.xy;float a=R.z;float u=step(72.,a)*step(a,96.)*exp(-mod(a,4.)*2.5);vec2 k=(d-.5)*vec2(R.x/R.y,1.);float g=atan(k.y,k.x),n=3.14159/3.;g=abs(mod(g,2.*n)-n);vec2 v=length(k)*vec2(cos(g),sin(g));vec2 h=mix(d,v*vec2(R.y/R.x,1.)+.5,u);vec3 b=texture(A,h).rgb;b+=.06*(textureLod(A,h,3.).rgb+textureLod(A,h,5.).rgb+textureLod(A,h,7.).rgb);float o=fract(sin(dot(floor(gl_FragCoord.xy/3.),vec2(12.9,78.2)))*43758.5);b+=step(.997,o)*step(16.,a)*vec3(.6,.9,1.)*.3*(.5+.5*sin(a*7.+o*90.));float p=step(72.,a)*step(a,96.)*exp(-mod(a,4.)*5.);p+=exp(-abs(a-16.)*6.)+exp(-abs(a-40.)*6.)+exp(-abs(a-72.)*6.)+exp(-abs(a-96.)*6.)+exp(-abs(a-120.)*6.);b+=p*vec3(.7,.5,1.)*.2;b=r(b*.95);vec2 c=d-.5;b*=1.-dot(c,c)*.8;b=pow(b,vec3(.4545));float q=smoothstep(1.,2.5,a)*(1.-smoothstep(7.,9.,a));b=mix(b,vec3(1.),j(d,vec2(.5,.56),.45,0.)*q);b=mix(b,vec3(.8,1.,.95),j(d,vec2(.5,.46),.3,1.)*q*.8)
